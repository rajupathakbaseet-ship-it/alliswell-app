<script>
(function(){
var P=new URLSearchParams(location.search),EN=P.get('lang')==='en';
if(EN){document.documentElement.lang='en';document.title='Search – All Is Well Rashifal';$('h').textContent='🔍 Search the website';$('q').placeholder='e.g. Aries Horoscope 2027, Ekadashi, Marriage Muhurat';$('msg').textContent='Start typing…';$('sub').textContent='Pandit Raju Pathak • Horoscope • Transits • Panchang';}
function $(i){return document.getElementById(i)}
var TAGS=EN?[['Horoscope 2027','horoscope 2027'],['Daily Horoscope','horoscope today'],['Ekadashi','ekadashi'],['Marriage Muhurat','muhurat'],['Sade Sati','sade sati']]
:[['राशिफल 2027','राशिफल 2027'],['आज का राशिफल','आज का राशिफल'],['एकादशी','एकादशी'],['विवाह मुहूर्त','मुहूर्त'],['साढ़ेसाती','साढ़ेसाती'],['पूर्णिमा','पूर्णिमा']];
$('tags').innerHTML=TAGS.map(function(t){return '<a href="#" data-q="'+t[1]+'">'+t[0]+'</a>'}).join('');
$('tags').onclick=function(e){var q=e.target.getAttribute('data-q');if(q){e.preventDefault();$('q').value=q;run()}};
var IDX=[];
function norm(s){return (s||'').toLowerCase().replace(/[़]/g,'').replace(/rashiphal|rasifal|rashfal/g,'rashifal').replace(/kundali/g,'kundli')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function run(){
 var q=norm($('q').value.trim());
 if(!q){$('res').innerHTML='<small>'+(EN?'Start typing…':'लिखना शुरू करें…')+'</small>';return}
 var w=q.split(/\s+/);
 var out=IDX.map(function(x){var t=norm(x.t),d=norm(x.d),u=x.u.toLowerCase(),s=0;
   w.forEach(function(k){if(t.indexOf(k)>=0)s+=3;else if(d.indexOf(k)>=0)s+=1;else if(u.indexOf(k)>=0)s+=1;else s-=5});
   if(EN?x.l==='en':x.l==='hi')s+=1;return [s,x]}).filter(function(a){return a[0]>0}).sort(function(a,b){return b[0]-a[0]}).slice(0,25);
 $('res').innerHTML=out.length?out.map(function(a){var x=a[1];return '<a class="r" href="'+x.u+'"><b>'+esc(x.t)+'</b><small>'+esc(x.d.slice(0,150))+'</small></a>'}).join('')
  :'<small>'+(EN?'Nothing found. Try another word.':'कुछ नहीं मिला। कोई दूसरा शब्द लिखें।')+'</small>';
}
$('q').addEventListener('input',run);
fetch('/search.json').then(function(r){return r.json()}).then(function(d){IDX=d;var q0=P.get('q');if(q0){$('q').value=q0}run()}).catch(function(){$('res').innerHTML='<small>'+(EN?'Search is not available right now.':'खोज अभी उपलब्ध नहीं है।')+'</small>'});
})();
</script>
