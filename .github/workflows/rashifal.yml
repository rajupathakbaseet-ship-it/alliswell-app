name: Daily Rashifal Pages
on:
  schedule:
    - cron: "45 18 * * *"   # रोज़ रात 12:15 बजे (भारत समय)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rashifal-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wake server
        run: curl -s -m 90 https://alliswell-server.onrender.com/ > /dev/null || true
      - name: Make rashi pages
        run: python scripts/gen_rashi.py
      - name: Make English pages
        run: python scripts/gen_en.py
      - name: Save
        run: |
          git config user.name "rashifal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && exit 0
          git commit -m "आज का राशिफल पेज $(TZ=Asia/Kolkata date +%Y-%m-%d)"
          git pull --rebase
          git push
